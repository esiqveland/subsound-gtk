name: publish-flatpak

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

# Serialize runs so two publishes can't race the git push to the pages repo.
concurrency:
  group: publish-flatpak
  cancel-in-progress: false

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Pin the git source to exactly the ref that triggered this build, and drop
      # the commit pin so the manifest can never go stale against a new release.
      - name: Pin manifest source to build ref
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SRC="tag: ${GITHUB_REF_NAME}"
          else
            # a raw commit sha is valid in the branch field; race-free even if main moves
            SRC="branch: ${GITHUB_SHA}"
          fi
          sed -i \
            -e "/^ *commit: /d" \
            -e "s|^\( *\)tag: v[0-9][0-9.]*$|\1${SRC}|" \
            io.github.subsoundorg.Subsound.yml
          echo "=== source ref in manifest ==="
          grep -E "tag:|branch:" io.github.subsoundorg.Subsound.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.subsoundorg.Subsound.flatpak
          manifest-path: io.github.subsoundorg.Subsound.yml
          cache-key: flatpak-builder-${{ github.sha }}
      # Generate static deltas so updates only download changed objects
      - name: Add static deltas
        run: flatpak build-update-repo repo --generate-static-deltas
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/

  publish:
    name: "Publish to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: repo/

      # Push the OSTree repo directory to the hosting GitHub repo.
      # clean: false is critical — OSTree is append-only; deleting old objects
      # breaks existing installations mid-update.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: subsoundorg/subsound-gtk-repo
          ssh-key: ${{ secrets.FLATPAK_REPO_DEPLOY_KEY }}
          branch: main
          folder: repo
          clean: false